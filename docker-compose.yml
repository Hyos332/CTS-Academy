services:
  postgres:
    image: postgres:16-alpine
    container_name: cts-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cts_academy
    ports:
      - "5432:5432"
    volumes:
      - cts_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cts_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cts-academy-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - cts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cts_postgres_data:
  cts_redis_data:
